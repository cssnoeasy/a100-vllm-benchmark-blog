# ─── 站点设置 ───
title: A100 vLLM 技术博客
description: >-
  大模型推理部署 · 性能调优 · 平台架构实战
url: https://cssnoeasy.github.io
baseurl: /a100-vllm-benchmark-blog

# ─── 插件 ───
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ─── 构建设置 ───
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# ─── 永久链接 ───
permalink: /:title/

# ─── 默认 front matter ───
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

# ─── 排除文件 ───
exclude:
  - .git
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock
